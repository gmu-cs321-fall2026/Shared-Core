# ---- Shared Core service settings ----
spring.application.name=shared-core
server.port=8080

# Read settings from the .env file in the repo root (if it exists).
# Values from real environment variables (e.g. in Docker later) take priority.
spring.config.import=optional:file:.env[.properties]

# ---- Database connection ----
# ${NAME:default} means "use NAME from .env, or the default if it's missing".
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:careerlaunch}
spring.datasource.username=${POSTGRES_USER:sharedcore}
spring.datasource.password=${POSTGRES_PASSWORD:}

# ---- Connection pool (HikariCP, built into Spring Boot) ----
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=3000

# ---- Login tokens (JWT) ----
# The secret signs every token. Must be at least 32 characters. Set it in .env.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expires-minutes=${JWT_EXPIRES_MINUTES:60}
