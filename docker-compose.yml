# Local development database (PostgreSQL 16).
# If you already have PostgreSQL installed, set DB_PORT=5433 in your .env.
services:
  db:
    image: postgres:16
    env_file: .env
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./db:/db:ro
      - ./db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
