# Local development database.
# The Shared Core service will be added here once the tech stack is chosen.
services:
  db:
    image: postgres:16
    env_file: .env
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./db:/db:ro
      - ./db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
